# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Repository layer on top of the organization settings. Values set here win; everything else comes
# from the organization. Reviews run only on request: add the `needs-review` label, or comment
# `@coderabbitai review`.
inheritance: true
language: en-US
tone_instructions: "Be direct and concise. Prioritize correctness, regressions, security, runtime behavior, and missing tests over style nits."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  # No "Review skipped" comment on every unlabeled PR.
  review_status: false
  review_details: false
  commit_status: false
  collapse_walkthrough: true
  poem: false

  auto_review:
    enabled: false
    # One review per request. Later pushes are not re-reviewed until someone asks again.
    auto_incremental_review: false
    drafts: false
    labels:
      - needs-review
      - "!skip-review"
      - "!no-review"
      - "!autorelease: pending"
    base_branches:
      - main
    ignore_title_keywords:
      - "[skip review]"
      - "DO NOT MERGE"
    ignore_usernames:
      - "dependabot[bot]"
      - "github-actions[bot]"

  path_filters:
    # FlatBuffers compiler output.
    - "!eyepop/events/**"

  pre_merge_checks:
    docstrings:
      mode: "off"

  tools:
    actionlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
    # CI already gates on ruff (eyepop-actions python-lint).
    ruff:
      enabled: false

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".agents/**/*.md"
      - ".claude/**/*.md"
      - "docs/**/*.md"

chat:
  # Reply only when mentioned, so threads don't trigger CodeRabbit on their own.
  auto_reply: false
  art: false
