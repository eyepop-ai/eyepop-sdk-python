name: Sessions Smoke

on:
  schedule:
    # Run hourly at minute 30.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to smoke
        required: true
        default: production
        type: environment
      sdk_version:
        description: "SDK package to test: latest, source, or an exact version like 3.2.1"
        required: true
        default: latest
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  session-smoke:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }} transient session
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    env:
      SMOKE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      SDK_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.sdk_version || github.event_name == 'schedule' && 'latest' || 'source' }}
      EYEPOP_SESSION_NAME: smoke-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}-${{ github.run_id }}-${{ github.run_attempt }}
      EYEPOP_URL: ${{ vars.EYEPOP_URL }}
      SUMMARY_JSON: session-smoke-summary.json
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false

      - name: Initialize smoke summary state
        if: always()
        run: date +%s > "$RUNNER_TEMP/session-smoke-started-at"

      - name: Install uv
        id: setup_uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install SDK under test
        id: install_sdk
        run: |
          set -euo pipefail
          if [[ "$SDK_VERSION" == "source" ]]; then
            uv sync --locked --all-extras --dev
          else
            uv venv
            if [[ "$SDK_VERSION" == "latest" ]]; then
              uv pip install --upgrade eyepop
            elif [[ "$SDK_VERSION" == *.dev* || "$SDK_VERSION" == *rc* ]]; then
              # Pre-release builds (e.g. per-push TestPyPI dev packages) live on TestPyPI;
              # pull the package from there while resolving deps across both indexes
              # (unsafe-best-match lets deps like aiohttp resolve from PyPI instead of
              # TestPyPI's stale mirror).
              uv pip install --prerelease allow \
                --extra-index-url https://test.pypi.org/simple/ \
                --index-strategy unsafe-best-match \
                "eyepop==$SDK_VERSION"
            else
              uv pip install "eyepop==$SDK_VERSION"
            fi
          fi

      - name: Resolve installed SDK version
        id: resolve_sdk
        run: |
          set -euo pipefail
          if [[ "$SDK_VERSION" == "source" ]]; then
            uv run python -c 'from eyepop import __version__; print(__version__)' \
              > "$RUNNER_TEMP/session-smoke-sdk-version"
          else
            "$GITHUB_WORKSPACE/.venv/bin/python" -c 'from eyepop import __version__; print(__version__)' \
              > "$RUNNER_TEMP/session-smoke-sdk-version"
          fi

      - name: Run SDK session smoke
        id: smoke
        env:
          EYEPOP_API_KEY: ${{ secrets.EYEPOP_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "$SDK_VERSION" == "source" ]]; then
            uv run python scripts/session_smoke.py \
              --environment "$SMOKE_ENVIRONMENT" \
              --image tests/test.jpg \
              --summary-json "$SUMMARY_JSON"
          else
            cd "$RUNNER_TEMP"
            "$GITHUB_WORKSPACE/.venv/bin/python" "$GITHUB_WORKSPACE/scripts/session_smoke.py" \
              --environment "$SMOKE_ENVIRONMENT" \
              --image "$GITHUB_WORKSPACE/tests/test.jpg" \
              --summary-json "$GITHUB_WORKSPACE/$SUMMARY_JSON"
          fi

      - name: Ensure smoke JSON summary
        if: always()
        env:
          CHECKOUT_CONCLUSION: ${{ steps.checkout.conclusion }}
          SETUP_UV_CONCLUSION: ${{ steps.setup_uv.conclusion }}
          INSTALL_SDK_CONCLUSION: ${{ steps.install_sdk.conclusion }}
          RESOLVE_SDK_CONCLUSION: ${{ steps.resolve_sdk.conclusion }}
          SMOKE_CONCLUSION: ${{ steps.smoke.conclusion }}
        run: |
          set -euo pipefail
          summary_path="$GITHUB_WORKSPACE/$SUMMARY_JSON"
          helper="$GITHUB_WORKSPACE/scripts/session_smoke_summary.py"

          if [[ -f "$helper" ]]; then
            python "$helper" \
              --summary-json "$summary_path" \
              --environment "$SMOKE_ENVIRONMENT" \
              --requested-sdk-version "$SDK_VERSION" \
              --session-name "$EYEPOP_SESSION_NAME" \
              --resolved-sdk-version-file "$RUNNER_TEMP/session-smoke-sdk-version" \
              --started-at-file "$RUNNER_TEMP/session-smoke-started-at" \
              --step "checkout=$CHECKOUT_CONCLUSION" \
              --step "setup_uv=$SETUP_UV_CONCLUSION" \
              --step "install_sdk=$INSTALL_SDK_CONCLUSION" \
              --step "resolve_sdk=$RESOLVE_SDK_CONCLUSION" \
              --step "smoke=$SMOKE_CONCLUSION"
          else
            python - "$summary_path" <<'PY'
          import json
          import os
          import sys
          import time

          steps = (
              ("checkout", "checkout", "Repository checkout failed before the smoke harness started."),
              ("setup_uv", "setup", "Smoke runner setup failed before the SDK was installed."),
              ("install_sdk", "sdk_install", "SDK installation failed before the smoke harness started."),
              ("resolve_sdk", "sdk_resolution", "Installed SDK version resolution failed before the smoke harness started."),
          )
          conclusions = {
              "checkout": os.environ.get("CHECKOUT_CONCLUSION", ""),
              "setup_uv": os.environ.get("SETUP_UV_CONCLUSION", ""),
              "install_sdk": os.environ.get("INSTALL_SDK_CONCLUSION", ""),
              "resolve_sdk": os.environ.get("RESOLVE_SDK_CONCLUSION", ""),
          }
          phase, error = next(
              ((phase, error) for step, phase, error in steps if conclusions[step] in {"failure", "cancelled", "timed_out"}),
              ("harness", "Smoke workflow did not produce a valid JSON summary."),
          )
          server_url = os.environ.get("GITHUB_SERVER_URL", "")
          repository = os.environ.get("GITHUB_REPOSITORY", "")
          run_id = os.environ.get("GITHUB_RUN_ID", "")
          run_url = f"{server_url}/{repository}/actions/runs/{run_id}" if server_url and repository and run_id else ""
          summary = {
              "ok": False,
              "environment": os.environ.get("SMOKE_ENVIRONMENT", ""),
              "requested_sdk_version": os.environ.get("SDK_VERSION", ""),
              "sdk_version": "",
              "phase": phase,
              "failure_kind": "setup" if phase != "harness" else "harness",
              "error": error,
              "github_run_id": run_id,
              "github_run_url": run_url,
              "session_name": os.environ.get("EYEPOP_SESSION_NAME", ""),
              "session_uuid": "",
              "session_uuid_short": "",
              "prediction_count": None,
              "matching_object_count": None,
              "cleanup": {"ok": False, "result": "not_started"},
              "duration_seconds": 0.0,
          }
          with open(sys.argv[1], "w") as summary_file:
              json.dump(summary, summary_file, indent=2, sort_keys=True)
              summary_file.write("\n")
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY
          fi

      - name: Write summary
        if: always()
        run: |
          {
            echo "## Sessions Smoke"
            echo ""
            echo "- environment: $SMOKE_ENVIRONMENT"
            echo "- requested_sdk: $SDK_VERSION"
            echo "- conclusion: ${{ steps.smoke.conclusion }}"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            if [[ -f "$SUMMARY_JSON" ]] && jq -e . "$SUMMARY_JSON" >/dev/null 2>&1; then
              jq -r '
                "- ok: \((.ok // false)|tostring)",
                "- sdk_version: \(.sdk_version // "n/a")",
                "- phase: \(.phase // "harness")",
                "- failure_kind: \(.failure_kind // "harness")",
                "- session_name: \(.session_name // "n/a")",
                "- session_uuid: \(.session_uuid_short // "n/a")",
                "- ability: \(.ability // "n/a")",
                "- predictions: \((.prediction_count // "n/a")|tostring)",
                "- matching_objects: \((.matching_object_count // "n/a")|tostring)",
                "- cleanup: \(.cleanup.result // "n/a")",
                "- duration_seconds: \((.duration_seconds // "n/a")|tostring)",
                if .error then "- error: \(.error)" else empty end
              ' "$SUMMARY_JSON"
            else
              echo "- result: summary handler failed; inspect this run"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload smoke summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sessions-smoke-summary-${{ env.SMOKE_ENVIRONMENT }}
          path: ${{ env.SUMMARY_JSON }}
          if-no-files-found: error

      - name: Notify Slack
        if: ${{ failure() }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SMOKE_CONCLUSION: ${{ steps.smoke.conclusion }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [[ -z "${SLACK_WEBHOOK_URL:-}" ]]; then
            echo "SLACK_WEBHOOK_URL not set; skipping Slack notification"
            exit 0
          fi

          session_uuid="n/a"
          session_name="n/a"
          predictions="n/a"
          matching_objects="n/a"
          cleanup="n/a"
          duration="n/a"
          actual_sdk="n/a"
          phase="harness"
          failure_kind="harness"
          reason="Smoke summary handler failed; inspect the GitHub run."

          if [[ -f "$SUMMARY_JSON" ]] && jq -e . "$SUMMARY_JSON" >/dev/null 2>&1; then
            actual_sdk="$(jq -r '.sdk_version // "n/a"' "$SUMMARY_JSON")"
            phase="$(jq -r '.phase // "harness"' "$SUMMARY_JSON")"
            failure_kind="$(jq -r '.failure_kind // "harness"' "$SUMMARY_JSON")"
            session_name="$(jq -r '.session_name // "n/a"' "$SUMMARY_JSON")"
            session_uuid="$(jq -r '.session_uuid_short // "n/a"' "$SUMMARY_JSON")"
            predictions="$(jq -r '(.prediction_count // "n/a")|tostring' "$SUMMARY_JSON")"
            matching_objects="$(jq -r '(.matching_object_count // "n/a")|tostring' "$SUMMARY_JSON")"
            cleanup="$(jq -r '.cleanup.result // "n/a"' "$SUMMARY_JSON")"
            duration="$(jq -r '(.duration_seconds // "n/a")|tostring' "$SUMMARY_JSON")"
            reason="$(jq -r '.error // ""' "$SUMMARY_JSON")"
          fi

          if [[ -z "$reason" ]]; then
            reason="${failure_kind^} failure during ${phase}."
          fi

          title="Production sessions smoke"
          if [[ "$SMOKE_ENVIRONMENT" != "production" ]]; then
            title="${SMOKE_ENVIRONMENT^} sessions smoke"
          fi

          text="$title failed: $reason"

          jq -n \
            --arg text "$text" \
            --arg title "$title" \
            --arg reason "$reason" \
            --arg environment "$SMOKE_ENVIRONMENT" \
            --arg requested_sdk "$SDK_VERSION" \
            --arg actual_sdk "$actual_sdk" \
            --arg phase "$phase" \
            --arg failure_kind "$failure_kind" \
            --arg session_name "$session_name" \
            --arg session_uuid "$session_uuid" \
            --arg predictions "$predictions" \
            --arg matching_objects "$matching_objects" \
            --arg cleanup "$cleanup" \
            --arg duration "$duration" \
            --arg run_url "$RUN_URL" \
            '{
              text: $text,
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*" + $title + " failed*")
                  }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*Reason:* " + $reason)
                  }
                },
                {
                  type: "section",
                  fields: [
                    {type: "mrkdwn", text: ("*Environment:*\n" + $environment)},
                    {type: "mrkdwn", text: ("*SDK:*\n" + $actual_sdk + " (requested: " + $requested_sdk + ")")},
                    {type: "mrkdwn", text: ("*Failure:*\n" + $failure_kind + " / " + $phase)},
                    {type: "mrkdwn", text: ("*Session name:*\n" + $session_name)},
                    {type: "mrkdwn", text: ("*Session:*\n" + $session_uuid)},
                    {type: "mrkdwn", text: ("*Predictions:*\n" + $predictions)},
                    {type: "mrkdwn", text: ("*Matching objects:*\n" + $matching_objects)},
                    {type: "mrkdwn", text: ("*Cleanup:*\n" + $cleanup)},
                    {type: "mrkdwn", text: ("*Duration:*\n" + $duration + "s")}
                  ]
                },
                {
                  type: "actions",
                  elements: [
                    {
                      type: "button",
                      text: {type: "plain_text", text: "Open GitHub run"},
                      url: $run_url
                    }
                  ]
                }
              ]
            }' > slack-payload.json

          for attempt in 1 2 3; do
            if curl --fail-with-body -sS -X POST \
              -H "Content-Type: application/json" \
              --data @slack-payload.json \
              "$SLACK_WEBHOOK_URL"; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              exit 1
            fi

            sleep $((attempt * 5))
          done
