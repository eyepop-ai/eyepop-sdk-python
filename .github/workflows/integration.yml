name: Staging SDK Integration

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "eyepop/**"
      - "tests/integration/**"
      - "tests/test.jpg"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"

# A user gets one transient session at a time, and every staging run in this repo
# (this workflow and a dispatched staging Sessions Smoke) uses the same test
# account. Runs share one group and queue, so they never take the session from
# each other.
concurrency:
  group: eyepop-session-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    name: staging integration
    # Fork PRs get no secrets, so the tests would all skip and report green.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    env:
      EYEPOP_URL: ${{ vars.EYEPOP_URL }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install dependencies
      run: uv sync --locked --all-extras --dev

    - name: Run integration tests
      env:
        EYEPOP_API_KEY: ${{ secrets.EYEPOP_API_KEY }}
        EYEPOP_ACCOUNT_UUID: ${{ vars.EYEPOP_ACCOUNT_UUID }}
      run: |
        # pipefail keeps pytest's exit code; without it tee's exit 0 hid every failure.
        set -o pipefail
        status=0
        uv run pytest tests/integration/ -v -s --tb=short --timeout=300 2>&1 | tee test_output.txt || status=$?
        {
          echo "## Integration Test Results"
          echo '```'
          cat test_output.txt
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        exit "$status"
